name: Syndicate Daily Production Pipeline

on:
  schedule:
    # 09:00 UTC = 5:00 AM EDT
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas python-dotenv

      - name: Reconcile Settlements & Audit CLV
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python settlement_engine.py

      - name: Ingest Fresh Board, Apply VaR Cap & Email Slate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY_1: ${{ secrets.ODDS_API_KEY_1 }} ODDS_API_KEY_2:${{ secrets.ODDS_API_KEY_2 }}
          ODDS_API_KEY_3: ${{ secrets.ODDS_API_KEY_3 }} ODDS_API_KEY_4:${{ secrets.ODDS_API_KEY_4 }}
          MAX_DAILY_EXPOSURE_UNITS: "6.0"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECIPIENT_EMAIL: "hovapicks@gmail.com"
        run: python pipeline_worker.py
